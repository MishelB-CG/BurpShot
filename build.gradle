plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Burp at runtime. Pin to a specific release if you prefer reproducible builds.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:+'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'pt-screenshot-builder'
    archiveVersion = ''
}
