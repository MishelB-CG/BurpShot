plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Burp at runtime (pinned for reproducible builds).
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'

    // SFTP/SCP for "Share -> Save to remote" (BSD licence). The same jar is vendored in libs/ with its
    // SHA-256 for offline use; it is bundled into the extension jar by the jar task below.
    implementation 'com.github.mwiede:jsch:2.28.8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'burpshot'
    archiveVersion = ''

    // Fat jar: Burp loads a single jar, so bundle the runtime dependencies (JSch).
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    // JSch ships Java 11+ specific classes under META-INF/versions; keep them usable in the merged jar.
    manifest { attributes 'Multi-Release': 'true' }
}
